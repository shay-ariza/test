# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          
      - name: Counts how many videos exists
        id: video_count
        run: |
          count=$(find attachments -type f | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Found $count files"
      - name: Comment PR with test results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const videoCount = '${{ steps.video_count.outputs.count }}';
            let comment = `## PR Check Report\n\n`;
            comment += `**Attachments Folder:** Contains ${videoCount} files\n\n`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
