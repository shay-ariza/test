name: demo-gate

on:
  workflow_call:
    inputs:
      attachments_path:
        description: 'Path to video attachments folder'
        default: 'attachments'
        type: string
      component_prefix:
        description: 'PR title component prefix (case-insensitive, e.g. "aiux")'
        default: 'aiux'
        type: string
      skip_label:
        description: 'Label that skips the video check'
        default: 'skip-video-check'
        type: string
      video_label:
        description: 'Label applied when check passes'
        default: 'has_video'
        type: string
    secrets:
      TOKEN_SECRET:
        required: true
      POWER_AUTOMATE_URL:
        required: true

permissions:
  pull-requests: write
  issues: write
  contents: write
  checks: write
  actions: read

jobs:
  video-count-check:
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
      componentName: ${{ steps.result.outputs.componentName }}
      shortDescription: ${{ steps.result.outputs.shortDescription }}
    if: |
      !contains(github.event.pull_request.labels.*.name, inputs.skip_label) &&
      !contains(github.event.issue.labels.*.name, inputs.skip_label) &&
      (
        github.event_name == 'pull_request' ||
        (github.event.issue.pull_request != null && contains(github.event.comment.body, '@check-video'))
      )
    steps:
      - name: Resolve refs (PR event)
        if: github.event_name == 'pull_request'
        id: pr_from_event
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            echo "base=${{ github.event.pull_request.base.ref }}"
            echo "head=${{ github.event.pull_request.head.sha }}"
            echo "title<<PR_EOF"
            echo "$PR_TITLE"
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_BODY"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve refs (comment event)
        if: github.event_name == 'issue_comment'
        id: pr_from_api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --json baseRefName,headRefOid,title,body)
          {
            echo "base=$(echo "$PR_JSON" | jq -r .baseRefName)"
            echo "head=$(echo "$PR_JSON" | jq -r .headRefOid)"
            echo "title<<PR_EOF"
            echo "$PR_JSON" | jq -r .title
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_JSON" | jq -r .body
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.base || steps.pr_from_api.outputs.base }}
          fetch-depth: 1

      - name: Count videos on base branch
        id: video_count_prev
        run: |
          count_prev=$(find "${{ inputs.attachments_path }}" -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          echo "count_prev=$count_prev" >> "$GITHUB_OUTPUT"
          echo "Found $count_prev video(s) on base branch"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          fetch-depth: 1

      - name: Count videos on PR branch and calculate diff.
        env:
          VIDEO_COUNT_BEFORE: ${{ steps.video_count_prev.outputs.count_prev }}
        id: video_count_new
        run: |
          count_new=$(find "${{ inputs.attachments_path }}" -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          diff=$(( count_new - $VIDEO_COUNT_BEFORE ))
          echo "diff=$diff" >> "$GITHUB_OUTPUT"
          echo "Found $count_new video(s) on PR branch (diff: $diff)"

      - name: Compute check result
        id: result
        env:
          PR_TITLE: ${{ steps.pr_from_event.outputs.title || steps.pr_from_api.outputs.title }}
        run: |
          before=${{ steps.video_count_prev.outputs.count_prev }}
          diff=${{ steps.video_count_new.outputs.diff }}
          after=$(( before + diff ))

          prefix="${{ inputs.component_prefix }}"
          shopt -s nocasematch
          if [[ "$PR_TITLE" =~ (${prefix}-[^[:space:]:]+)([[:space:]]*:*[[:space:]]*)[[:space:]]*(.*)$ ]]; then
            titleValid=true
            componentName="${BASH_REMATCH[1]}"
            shortDescription="${BASH_REMATCH[3]}"
          else
            titleValid=false
            componentName=""
            shortDescription=""
            echo "::warning::PR title does not match '${prefix^^}-<id>: <short-description>': $PR_TITLE"
          fi
          shopt -u nocasematch
          echo "Resolved componentName: $componentName"

          if [ "$diff" -eq 1 ] && [ "$titleValid" = true ]; then
            conclusion="success"
            status="✅ PASS"
          else
            conclusion="failure"
            status="❌ FAIL"
          fi
          echo "before=$before"                     >> "$GITHUB_OUTPUT"
          echo "after=$after"                       >> "$GITHUB_OUTPUT"
          echo "diff=$diff"                          >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion"              >> "$GITHUB_OUTPUT"
          echo "status=$status"                      >> "$GITHUB_OUTPUT"
          echo "componentName=$componentName"        >> "$GITHUB_OUTPUT"
          echo "shortDescription=$shortDescription"  >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        env:
          BEFORE: ${{ steps.result.outputs.before }}
          AFTER: ${{ steps.result.outputs.after }}
          DIFF: ${{ steps.result.outputs.diff }}
          STATUS: ${{ steps.result.outputs.status }}
          COMPONENT_NAME: ${{ steps.result.outputs.componentName }}
          SHORT_DESCRIPTION: ${{ steps.result.outputs.shortDescription }}
        with:
          script: |
            const before    = process.env.BEFORE;
            const after     = process.env.AFTER;
            const diff      = parseInt(process.env.DIFF, 10);
            const status    = process.env.STATUS;
            const component = process.env.COMPONENT_NAME || '_(unresolved — PR title invalid)_';
            const shortDesc = process.env.SHORT_DESCRIPTION || '_(unresolved — PR title invalid)_';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## PR Video Attachment Report',
                '',
                '| | Count |',
                '|---|---|',
                `| Videos on base branch | ${before} |`,
                `| Videos on PR branch   | ${after}  |`,
                `| **Net change**        | **${diff > 0 ? '+' : ''}${diff}** |`,
                '',
                '| | Parsed from PR title |',
                '|---|---|',
                `| Component   | ${component} |`,
                `| Description | ${shortDesc} |`,
                '',
                `**Status:** ${status} (Expected exactly 1 video to be added and a valid PR title)`,
              ].join('\n'),
            });

      - name: Create check run
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          STATUS: ${{ steps.result.outputs.status }}
          DIFF: ${{ steps.result.outputs.diff }}
        with:
          script: |
            const diff       = parseInt(process.env.DIFF, 10);
            const conclusion = process.env.CONCLUSION;
            const status     = process.env.STATUS;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'video-count-check',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              output: {
                title: status,
                summary: `Expected exactly 1 video added, got ${diff > 0 ? '+' : ''}${diff}`,
              },
            });

      - name: Sync has_video label
        uses: actions/github-script@v7
        env:
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          VIDEO_LABEL: ${{ inputs.video_label }}
        with:
          script: |
            const passed = process.env.CONCLUSION === 'success';
            const label  = process.env.VIDEO_LABEL;

            if (passed) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

  post-artifact:
    needs: video-count-check
    if: needs.video-count-check.outputs.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR metadata (PR event)
        if: github.event_name == 'pull_request'
        id: pr_from_event
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            echo "head=${{ github.event.pull_request.head.ref }}"
            echo "title<<PR_EOF"
            echo "$PR_TITLE"
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_BODY"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR metadata (comment event)
        if: github.event_name == 'issue_comment'
        id: pr_from_api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --json headRefName,title,body)
          {
            echo "head=$(echo "$PR_JSON" | jq -r .headRefName)"
            echo "title<<PR_EOF"
            echo "$PR_JSON" | jq -r .title
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_JSON" | jq -r .body
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          fetch-depth: 0

      - name: Upload videos as artifact
        id: upload_video
        uses: actions/upload-artifact@v4
        with:
          name: new-video
          path: |
            ${{ inputs.attachments_path }}/**/*.mov
            ${{ inputs.attachments_path }}/**/*.mp4

      - name: REST POST the content of the artifact
        env:
          ARTIFACT_URL: https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.upload_video.outputs.artifact-id }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          COMPONENT_NAME: ${{ needs.video-count-check.outputs.componentName }}
          SHORT_DESCRIPTION: ${{ needs.video-count-check.outputs.shortDescription }}
          PR_BODY: ${{ steps.pr_from_event.outputs.body || steps.pr_from_api.outputs.body }}
        run: |
          echo "API Download URL: $ARTIFACT_URL"
          echo "Resolved componentName: $COMPONENT_NAME"

          jq -n \
            --arg token "$TOKEN_SECRET" \
            --arg url "$ARTIFACT_URL" \
            --arg shortDescription "$SHORT_DESCRIPTION" \
            --arg componentName "$COMPONENT_NAME" \
            --arg fileName "fileName.zip" \
            --arg description "$PR_BODY" \
            '{TOKEN: $token, URL: $url, componentName: $componentName, "short-description": $shortDescription, description: $description, fileName: $fileName}' \
          | curl -X POST \
            "${{ secrets.POWER_AUTOMATE_URL }}" \
            -H "Content-Type: application/json" \
            -d @-

      - name: Cleanup
        id: cleanup
        env:
          PR_HEAD: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
        run: |
          find "${{ inputs.attachments_path }}" -type f \( -name "*.mp4" -o -name "*.mov" \) -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update attachments [skip ci]"
            git push origin HEAD:"$PR_HEAD"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Carry passing check onto cleanup commit
        if: steps.cleanup.outputs.pushed == 'true'
        uses: actions/github-script@v7
        env:
          NEW_SHA: ${{ steps.cleanup.outputs.new_sha }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'video-count-check',
              head_sha: process.env.NEW_SHA,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: '✅ PASS (automated cleanup commit)',
                summary: 'Bot attachment-cleanup commit — video-count-check inherited from the prior commit so the PR stays mergeable.',
              },
            });
