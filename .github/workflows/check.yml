name: demo-gate

on:
  workflow_call:
    inputs:
      attachments_path:
        description: 'Path to video attachments folder'
        required: true
        type: string
      component_prefix:
        description: 'PR title component prefix (case-insensitive, e.g. "aiux")'
        required: true
        type: string
      video_label:
        description: 'Label applied when check passes'
        default: 'has_video'
        type: string
      group:
        description: 'Team/org group submitting the demo (e.g. "aiux", "platform")'
        required: true
        type: string
    secrets:
      TOKEN_SECRET:
        required: true
      POWER_AUTOMATE_URL:
        required: true

permissions:
  pull-requests: write
  issues: write
  contents: write
  checks: write
  actions: read

jobs:
  video-count-check:
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
      componentName: ${{ steps.result.outputs.componentName }}
      shortDescription: ${{ steps.result.outputs.shortDescription }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null && contains(github.event.comment.body, '@check-video'))
    steps:
      - name: Resolve refs (PR event)
        if: github.event_name == 'pull_request'
        id: pr_from_event
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            echo "base=${{ github.event.pull_request.base.ref }}"
            echo "head=${{ github.event.pull_request.head.sha }}"
            echo "title<<PR_EOF"
            echo "$PR_TITLE"
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_BODY"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve refs (comment event)
        if: github.event_name == 'issue_comment'
        id: pr_from_api
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base', data.base.ref);
            core.setOutput('head', data.head.sha);
            core.setOutput('title', data.title);
            core.setOutput('body', data.body ?? '');

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.base || steps.pr_from_api.outputs.base }}
          fetch-depth: 1

      - name: Count videos on base branch
        id: video_count_prev
        run: |
          count_prev=$(find "${{ inputs.attachments_path }}" -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          echo "count_prev=$count_prev" >> "$GITHUB_OUTPUT"
          echo "Found $count_prev video(s) on base branch"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          fetch-depth: 1

      - name: Count videos on PR branch and calculate diff.
        env:
          VIDEO_COUNT_BEFORE: ${{ steps.video_count_prev.outputs.count_prev }}
        id: video_count_new
        run: |
          count_new=$(find "${{ inputs.attachments_path }}" -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          diff=$(( count_new - $VIDEO_COUNT_BEFORE ))
          echo "diff=$diff" >> "$GITHUB_OUTPUT"
          echo "Found $count_new video(s) on PR branch (diff: $diff)"

      - name: Check for previous successful runs
        if: steps.video_count_new.outputs.diff != '1'
        id: prev_pass
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            let foundPass = false;
            for (const commit of commits) {
              if (commit.sha === headSha) continue;
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: commit.sha,
                check_name: 'video-count-check',
              });
              if (data.check_runs.some(r => r.conclusion === 'success')) {
                foundPass = true;
                break;
              }
            }

            if (foundPass) {
              core.info('Previous successful video-count-check found — issuing carried check run.');
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'video-count-check',
                head_sha: headSha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: '✅ PASS (carried from prior commit)',
                  summary: 'A previous commit on this PR already passed video-count-check — this commit inherits that status.',
                },
              });
              core.setOutput('conclusion', 'skipped');
            }
            
      - name: Compute check result
        if: steps.prev_pass.outputs.conclusion != 'skipped'
        id: result
        env:
          PR_TITLE: ${{ steps.pr_from_event.outputs.title || steps.pr_from_api.outputs.title }}
          COMPONENT_PREFIX: ${{ inputs.component_prefix }}
        run: |
          before=${{ steps.video_count_prev.outputs.count_prev }}
          diff=${{ steps.video_count_new.outputs.diff }}
          after=$(( before + diff ))

          prefix="$COMPONENT_PREFIX"
          shopt -s nocasematch
          if [[ "$PR_TITLE" =~ (${prefix}-[^[:space:]:]+)([[:space:]]*:*[[:space:]]*)[[:space:]]*(.*)$ ]]; then
            titleValid=true
            componentName="${BASH_REMATCH[1]}"
            shortDescription="${BASH_REMATCH[3]}"
          else
            titleValid=false
            componentName=""
            shortDescription=""
            echo "::warning::PR title does not match '${prefix^^}-<id>: <short-description>': $PR_TITLE"
          fi
          shopt -u nocasematch
          echo "Resolved componentName: $componentName"

          if [ "$diff" -eq 1 ] && [ "$titleValid" = true ]; then
            conclusion="success"
            status="✅ PASS"
          else
            conclusion="failure"
            status="❌ FAIL"
          fi
          echo "before=$before"                     >> "$GITHUB_OUTPUT"
          echo "after=$after"                       >> "$GITHUB_OUTPUT"
          echo "diff=$diff"                          >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion"              >> "$GITHUB_OUTPUT"
          echo "status=$status"                      >> "$GITHUB_OUTPUT"
          echo "componentName=$componentName"        >> "$GITHUB_OUTPUT"
          echo "shortDescription=$shortDescription"  >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.prev_pass.outputs.conclusion != 'skipped'
        uses: actions/github-script@v7
        env:
          BEFORE: ${{ steps.result.outputs.before }}
          AFTER: ${{ steps.result.outputs.after }}
          DIFF: ${{ steps.result.outputs.diff }}
          STATUS: ${{ steps.result.outputs.status }}
          COMPONENT_NAME: ${{ steps.result.outputs.componentName }}
          SHORT_DESCRIPTION: ${{ steps.result.outputs.shortDescription }}
          COMPONENT_PREFIX: ${{ inputs.component_prefix }}
          ATTACHMENTS_PATH: ${{ inputs.attachments_path }}
        with:
          script: |
            const before    = process.env.BEFORE;
            const after     = process.env.AFTER;
            const diff      = parseInt(process.env.DIFF, 10);
            const status    = process.env.STATUS;
            const component = process.env.COMPONENT_NAME;
            const shortDesc = process.env.SHORT_DESCRIPTION;
            const prefix      = process.env.COMPONENT_PREFIX;
            const attachmentsPath = process.env.ATTACHMENTS_PATH;
            const titleValid  = !!(component && shortDesc);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## PR Video Attachment Report',
                '',
                '| | Count |',
                '|---|---|',
                `| Videos on base branch | ${before} |`,
                `| Videos on PR branch   | ${after}  |`,
                `| **Net change**        | **${diff > 0 ? '+' : ''}${diff}** |`,
                '',
                `| ${titleValid ? '' : `⚠️ unresolved title — expected: \`${prefix}-<component-name>: <short description>\``} | Parsed from PR title |`,
                '|---|---|',
                `| Component   | ${component} |`,
                `| Description | ${shortDesc} |`,
                '',
                `**Status:** ${status} (Expected exactly 1 video to be added and a valid PR title)`,
                `please make sure only one video is in path: ${attachmentsPath}`,
                'run again this report using @check-video comment on the PR',
              ].join('\n'),
            });
      - name: Sync has_video label
        if: steps.prev_pass.outputs.conclusion != 'skipped'
        uses: actions/github-script@v7
        env:
          conclusion: ${{ steps.result.outputs.conclusion }}
          VIDEO_LABEL: ${{ inputs.video_label }}
        with:
          script: |
            const passed = process.env.conclusion === 'success';
            const label  = process.env.VIDEO_LABEL;

            if (passed) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

  post-artifact:
    needs: video-count-check
    if: needs.video-count-check.outputs.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR metadata (PR event)
        if: github.event_name == 'pull_request'
        id: pr_from_event
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            echo "head=${{ github.event.pull_request.head.ref }}"
            echo "title<<PR_EOF"
            echo "$PR_TITLE"
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_BODY"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR metadata (comment event)
        if: github.event_name == 'issue_comment'
        id: pr_from_api
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head', data.head.ref);
            core.setOutput('title', data.title);
            core.setOutput('body', data.body ?? '');

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          fetch-depth: 0

      - name: Upload videos as artifact
        id: upload_video
        uses: actions/upload-artifact@v4
        with:
          name: new-video
          path: |
            ${{ inputs.attachments_path }}/**/*.mov
            ${{ inputs.attachments_path }}/**/*.mp4

      - name: send-power-automate
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
          COMPONENT_NAME: ${{ needs.video-count-check.outputs.componentName }}
          SHORT_DESCRIPTION: ${{ needs.video-count-check.outputs.shortDescription }}
          PR_BODY: ${{ steps.pr_from_event.outputs.body || steps.pr_from_api.outputs.body }}
          ATTACHMENTS_PATH: ${{ inputs.attachments_path }}
          GROUP: ${{ inputs.group }}
        run: bash .github/scripts/send-power-automate.sh

      - name: Cleanup
        id: cleanup
        env:
          PR_HEAD: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
        run: |
          find "${{ inputs.attachments_path }}" -type f \( -name "*.mp4" -o -name "*.mov" \) -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update attachments [skip ci]"
            git push origin HEAD:"$PR_HEAD"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Carry passing check onto cleanup commit
        if: steps.cleanup.outputs.pushed == 'true'
        uses: actions/github-script@v7
        env:
          NEW_SHA: ${{ steps.cleanup.outputs.new_sha }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'video-count-check',
              head_sha: process.env.NEW_SHA,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: '✅ PASS (automated cleanup commit)',
                summary: 'Bot attachment-cleanup commit — video-count-check inherited from the prior commit so the PR stays mergeable.',
              },
            });
