name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  count-base:
    runs-on: ubuntu-latest
    outputs:
      count_prev: ${{ steps.video_count_prev.outputs.count_prev }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Count videos on base
        id: video_count_prev
        run: |
          count_prev=$(find attachments -type f | grep -E "\.(mov|mp4)$" | wc -l)
          echo "count_prev=$count_prev" >> $GITHUB_OUTPUT
          echo "Found $count_prev files in base"

  count-head:
    runs-on: ubuntu-latest
    outputs:
      count_new: ${{ steps.video_count_new.outputs.count_new }}
    steps:
      - name: Checkout head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Count videos on head
        id: video_count_new
        run: |
          count_new=$(find attachments -type f | grep -E "\.(mov|mp4)$" | wc -l)
          echo "count_new=$count_new" >> $GITHUB_OUTPUT
          echo "Found $count_new files in head"

  comment-pr:
    runs-on: ubuntu-latest
    needs: [count-base, count-head]
    if: always()
    steps:
      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const videoCountBefore = parseInt('${{ needs.count-base.outputs.count_prev }}');
            const videoCountAfter = parseInt('${{ needs.count-head.outputs.count_new }}');
            let comment = `## PR Check Report\n\n`;
            comment += `**Attachments Folder:** Contains ${videoCountAfter - videoCountBefore} files\n\n`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
