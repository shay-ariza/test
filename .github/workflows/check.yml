name: Video Attachment Check

on:
  pull_request:
    branches: ["main"]
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: write
  checks: write
  actions: read

jobs:
  video-count-check:
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
    if: |
      (!contains(github.event.pull_request.labels.*.name, 'skip-video-check') && github.event_name == 'pull_request') ||
      (github.event.issue.pull_request != null && contains(github.event.comment.body, '@video-check'))
    steps:
      - name: Resolve refs (PR event)
        if: github.event_name == 'pull_request'
        id: pr_from_event
        run: |
          echo "base=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Resolve refs (comment event)
        if: github.event_name == 'issue_comment'
        id: pr_from_api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --json baseRefName,headRefOid --jq '"base="+.baseRefName+"\nhead="+.headRefOid' >> "$GITHUB_OUTPUT"

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.base || steps.pr_from_api.outputs.base }}
          fetch-depth: 1

      - name: Count videos on base branch
        id: video_count_prev
        run: |
          count_prev=$(find attachments -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          echo "count_prev=$count_prev" >> "$GITHUB_OUTPUT"
          echo "Found $count_prev video(s) on base branch"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          fetch-depth: 1

      - name: Count videos on PR branch and calculate diff.
        env:
          VIDEO_COUNT_BEFORE: ${{ steps.video_count_prev.outputs.count_prev }}
        id: video_count_new
        run: |
          count_new=$(find attachments -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          diff=$(( count_new - $VIDEO_COUNT_BEFORE ))
          echo "diff=$diff" >> "$GITHUB_OUTPUT"
          echo "Found $count_new video(s) on PR branch (diff: $diff)"

      - name: Compute check result
        id: result
        run: |
          before=${{ steps.video_count_prev.outputs.count_prev }}
          diff=${{ steps.video_count_new.outputs.diff }}
          after=$(( before + diff ))
          if [ "$diff" -eq 1 ]; then
            conclusion="success"
            status="✅ PASS"
          else
            conclusion="failure"
            status="❌ FAIL"
          fi
          echo "before=$before"         >> "$GITHUB_OUTPUT"
          echo "after=$after"           >> "$GITHUB_OUTPUT"
          echo "diff=$diff"             >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "status=$status"         >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        env:
          BEFORE: ${{ steps.result.outputs.before }}
          AFTER: ${{ steps.result.outputs.after }}
          DIFF: ${{ steps.result.outputs.diff }}
          STATUS: ${{ steps.result.outputs.status }}
        with:
          script: |
            const before = process.env.BEFORE;
            const after  = process.env.AFTER;
            const diff   = parseInt(process.env.DIFF, 10);
            const status = process.env.STATUS;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## PR Video Attachment Report',
                '',
                '| | Count |',
                '|---|---|',
                `| Videos on base branch | ${before} |`,
                `| Videos on PR branch   | ${after}  |`,
                `| **Net change**        | **${diff > 0 ? '+' : ''}${diff}** |`,
                '',
                `**Status:** ${status} (Expected exactly 1 video to be added)`,
              ].join('\n'),
            });

      - name: Create check run
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          STATUS: ${{ steps.result.outputs.status }}
          DIFF: ${{ steps.result.outputs.diff }}
        with:
          script: |
            const diff       = parseInt(process.env.DIFF, 10);
            const conclusion = process.env.CONCLUSION;
            const status     = process.env.STATUS;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'video-count-check',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              output: {
                title: status,
                summary: `Expected exactly 1 video added, got ${diff > 0 ? '+' : ''}${diff}`,
              },
            });

      - name: Sync has_video label
        uses: actions/github-script@v7
        env:
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
        with:
          script: |
            const passed = process.env.CONCLUSION === 'success';

            if (passed) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['has_video'],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: 'has_video',
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

  post-artifact:
    needs: video-count-check
    if: needs.video-count-check.outputs.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR metadata (PR event)
        if: github.event_name == 'pull_request'
        id: pr_from_event
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            echo "head=${{ github.event.pull_request.head.ref }}"
            echo "title<<PR_EOF"
            echo "$PR_TITLE"
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_BODY"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR metadata (comment event)
        if: github.event_name == 'issue_comment'
        id: pr_from_api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --json headRefName,title,body)
          {
            echo "head=$(echo "$PR_JSON" | jq -r .headRefName)"
            echo "title<<PR_EOF"
            echo "$PR_JSON" | jq -r .title
            echo "PR_EOF"
            echo "body<<PR_EOF"
            echo "$PR_JSON" | jq -r .body
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
          fetch-depth: 0

      - name: Upload videos as artifact
        id: upload_video
        uses: actions/upload-artifact@v4
        with:
          name: new-video
          path: |
            attachments/**/*.mov
            attachments/**/*.mp4

      - name: REST POST the content of the artifact
        env:
          ARTIFACT_URL: ${{ steps.upload_video.outputs.artifact-url }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          PR_TITLE: ${{ steps.pr_from_event.outputs.title || steps.pr_from_api.outputs.title }}
          PR_BODY: ${{ steps.pr_from_event.outputs.body || steps.pr_from_api.outputs.body }}
        run: |
          echo "API Download URL: $ARTIFACT_URL"
          jq -n \
            --arg token "$TOKEN_SECRET" \
            --arg url "$ARTIFACT_URL" \
            --arg text "$PR_BODY" \
            --arg folderName "$PR_TITLE" \
            --arg title "fileName.zip" \
            '{TOKEN: $token, URL: $url, text: $text, folderName: $folderName, title: $title}' \
          | curl -X POST \
            "https://default8bcff1709979491e8683d8ced0850b.ad.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f8ae6c6c9db44c9282cdbdaca3e3149d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UbwJQjeIyYbYDowL_phSZ7ER3FVLo_6BGHdKnlQet-0" \
            -H "Content-Type: application/json" \
            -d @-

      - name: Cleanup
        id: cleanup
        env:
          PR_HEAD: ${{ steps.pr_from_event.outputs.head || steps.pr_from_api.outputs.head }}
        run: |
          find attachments -type f \( -name "*.mp4" -o -name "*.mov" \) -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update attachments [skip ci]"
            git push origin HEAD:"$PR_HEAD"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Carry passing check onto cleanup commit
        if: steps.cleanup.outputs.pushed == 'true'
        uses: actions/github-script@v7
        env:
          NEW_SHA: ${{ steps.cleanup.outputs.new_sha }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'video-count-check',
              head_sha: process.env.NEW_SHA,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: '✅ PASS (automated cleanup commit)',
                summary: 'Bot attachment-cleanup commit — video-count-check inherited from the prior commit so the PR stays mergeable.',
              },
            });
