name: Video Attachment Check

on:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  video-count-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Count videos on base branch
        id: video_count_prev
        run: |
          count_prev=$(find attachments -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          echo "count_prev=$count_prev" >> "$GITHUB_OUTPUT"
          echo "Found $count_prev video(s) on base branch"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Echo PR info
        run: |
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Description: ${{ github.event.pull_request.body }}"

      - name: Count videos on PR branch and calculate diff
        env:
          VIDEO_COUNT_BEFORE: ${{ steps.video_count_prev.outputs.count_prev }}
        id: video_count_new
        run: |
          count_new=$(find attachments -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          diff=$(( count_new - VIDEO_COUNT_BEFORE ))
          echo "diff=$diff" >> "$GITHUB_OUTPUT"
          echo "Found $count_new video(s) on PR branch (diff: $diff)"

      - name: Get newest video
        if: steps.video_count_new.outputs.diff == '1'
        id: new_videos
        run: |
          mkdir -p /tmp/new_videos
          newest=$(find attachments -type f \( -name "*.mov" -o -name "*.mp4" \) -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          cp "$newest" /tmp/new_videos/

      - name: Upload new video as artifact
        if: steps.video_count_new.outputs.diff == '1'
        uses: actions/upload-artifact@v4
        with:
          name: new-video
          path: /tmp/new_videos/
          retention-days: 7

      - name: Comment PR with video diff
        if: success()
        uses: actions/github-script@v7
        env:
          VIDEO_COUNT_ADDED: ${{ steps.video_count_new.outputs.diff }}
        with:
          script: |
            const before = parseInt(process.env.VIDEO_COUNT_BEFORE, 10);
            const diff = parseInt(process.env.VIDEO_COUNT_ADDED, 10);
            const after  = before + diff;
            const sign   = diff > 0 ? '+' : '';
            const status = diff === 1 ? '✅ PASS' : '❌ FAIL';

            const comment = [
              '## PR Video Attachment Report',
              '',
              `| | Count |`,
              `|---|---|`,
              `| Videos on base branch | ${before} |`,
              `| Videos on PR branch   | ${after} |`,
              `| **Net change**        | **${sign}${diff}** |`,
              '',
              `**Status:** ${status} (Expected exactly 1 video to be added)`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

            if (diff !== 1) {
              core.setFailed(`Expected exactly 1 video to be added, but diff was ${sign}${diff}`);
            }

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/new_videos/
          find /attachments -type f \( -name "*.mp4" -o -name "*.mov" \) -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update attachments [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi