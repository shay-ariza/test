name: Video Attachment Check

on:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  video-count-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Count videos on base branch
        id: video_count_prev
        run: |
          count_prev=$(find attachments -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          echo "count_prev=$count_prev" >> "$GITHUB_OUTPUT"
          echo "Found $count_prev video(s) on base branch"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Count videos on PR branch and calculate diff
        env:
          VIDEO_COUNT_BEFORE: ${{ steps.video_count_prev.outputs.count_prev }}
        id: video_count_new
        run: |
          count_new=$(find attachments -type f \( -name "*.mov" -o -name "*.mp4" \) | wc -l)
          diff=$(( count_new - VIDEO_COUNT_BEFORE ))
          echo "diff=$diff" >> "$GITHUB_OUTPUT"
          echo "Found $count_new video(s) on PR branch (diff: $diff)"

      - name: Upload videos as artifact
        if: steps.video_count_new.outputs.diff == '1'
        id: upload_video
        uses: actions/upload-artifact@v4
        with:
          name: new-video
          path: |
            attachments/**/*.mov
            attachments/**/*.mp4
          retention-days: 7

      - name: REST POST the conetent of the artifact
        if: steps.video_count_new.outputs.diff == '1'
        run: |
          ARTIFACT_URL="${{ steps.upload_video.outputs.artifact-url }}"
          ARTIFACT_ID="${ARTIFACT_URL##*/}"
          API_ARTIFACT_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
          echo "API Download URL: $API_ARTIFACT_URL"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Description: ${{ github.event.pull_request.body }}"
          curl -X POST \
            "https://default8bcff1709979491e8683d8ced0850b.ad.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f8ae6c6c9db44c9282cdbdaca3e3149d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UbwJQjeIyYbYDowL_phSZ7ER3FVLo_6BGHdKnlQet-0" \
            -H "Content-Type: application/json" \
            -d '{
              "TOKEN": "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",
              "URL": "$API_ARTIFACT_URL",
              "text": "${{ github.event.pull_request.body }}",
              "folderName": "${{ github.event.pull_request.title }}",
              "title": "fileName.zip"
            }'

      - name: Comment PR with video diff
        if: success()
        uses: actions/github-script@v7
        env:
          VIDEO_COUNT_ADDED: ${{ steps.video_count_new.outputs.diff }}
        with:
          script: |
            const before = parseInt(process.env.VIDEO_COUNT_BEFORE, 10);
            const diff = parseInt(process.env.VIDEO_COUNT_ADDED, 10);
            const after  = before + diff;
            const sign   = diff > 0 ? '+' : '';
            const status = diff === 1 ? '✅ PASS' : '❌ FAIL';

            const comment = [
              '## PR Video Attachment Report',
              '',
              `| | Count |`,
              `|---|---|`,
              `| Videos on base branch | ${before} |`,
              `| Videos on PR branch   | ${after} |`,
              `| **Net change**        | **${sign}${diff}** |`,
              '',
              `**Status:** ${status} (Expected exactly 1 video to be added)`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

            if (diff !== 1) {
              core.setFailed(`Expected exactly 1 video to be added, but diff was ${sign}${diff}`);
            }

      # - name: Cleanup
      #   if: always()
      #   run: |
      #     find attachments -type f \( -name "*.mp4" -o -name "*.mov" \) -delete 2>/dev/null || true
      #     git config user.name "github-actions[bot]"
