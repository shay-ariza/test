name: Post Artifact

on:
  pull_request:
    types: [closed]

permissions:
  actions: read
  contents: write

jobs:
  post-artifact:
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'has_video')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload videos as artifact
        id: upload_video
        uses: actions/upload-artifact@v4
        with:
          name: new-video
          path: |
            attachments/**/*.mov
            attachments/**/*.mp4

      - name: REST POST the content of the artifact
        run: |
          API_ARTIFACT_URL=${{ steps.upload_video.outputs.artifact-url }}
          echo "API Download URL: $API_ARTIFACT_URL"
          curl -X POST \
            "https://default8bcff1709979491e8683d8ced0850b.ad.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f8ae6c6c9db44c9282cdbdaca3e3149d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UbwJQjeIyYbYDowL_phSZ7ER3FVLo_6BGHdKnlQet-0" \
            -H "Content-Type: application/json" \
            -d "{
              \"TOKEN\": \"${{ secrets.TOKEN_SECRET }}\",
              \"URL\": \"$API_ARTIFACT_URL\",
              \"text\": \"${{ github.event.pull_request.body }}\",
              \"folderName\": \"${{ github.event.pull_request.title }}\",
              \"title\": \"fileName.zip\"
            }"

      - name: Cleanup
        run: |
          find attachments -type f \( -name "*.mp4" -o -name "*.mov" \) -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update attachments [skip ci]"
            git push https://x-access-token:${{ secrets.ADMIN_PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.base_ref }}
          fi
