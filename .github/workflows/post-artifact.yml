name: Post Artifact

on:
  pull_request:
    types: [closed]

permissions:
  actions: read
  contents: write

jobs:
  post-artifact:
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'has_video')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find artifact from check workflow
        id: find_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/check.yml/runs?head_sha=${{ github.event.pull_request.head.sha }}&status=completed&per_page=1" \
            --jq '.workflow_runs[0].id')
          artifact_id=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.name == "new-video") | .id')
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: REST POST the content of the artifact
        if: steps.tag_check.outputs.present == 'true'
        run: |
          ARTIFACT_ID="${{ steps.find_artifact.outputs.artifact_id }}"
          API_ARTIFACT_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
          echo "API Download URL: $API_ARTIFACT_URL"
          curl -X POST \
            "https://default8bcff1709979491e8683d8ced0850b.ad.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f8ae6c6c9db44c9282cdbdaca3e3149d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UbwJQjeIyYbYDowL_phSZ7ER3FVLo_6BGHdKnlQet-0" \
            -H "Content-Type: application/json" \
            -d "{
              \"TOKEN\": \"${{ secrets.TOKEN_SECRET }}\",
              \"URL\": \"$API_ARTIFACT_URL\",
              \"text\": \"${{ github.event.pull_request.body }}\",
              \"folderName\": \"${{ github.event.pull_request.title }}\",
              \"title\": \"fileName.zip\"
            }"

      - name: Cleanup
        run: |
          find attachments -type f \( -name "*.mp4" -o -name "*.mov" \) -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update attachments [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
