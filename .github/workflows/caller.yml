name: demo-gate-caller

on:
  pull_request:
    branches: ["main"]
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  video-check:
    uses: ./.github/workflows/check.yml
    with:
      component_prefix: 'aiux'        # PR title prefix, e.g. "AIUX-123: description"
      attachments_path: 'attachments' # folder where videos live
      video_label: 'has_video'        # label applied on pass
      group: 'COE - AIUX component demos'                # default group for videos
      exempt_title_names: 'maint,chore'
    secrets:
      POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
